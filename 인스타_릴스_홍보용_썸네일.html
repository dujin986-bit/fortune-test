<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  body, html {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px;
    font-family: 'Pretendard', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31114b 100%);
    color: white;
    overflow: hidden;
  }
  .container {
    width: 1080px; height: 1920px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    padding: 150px 80px;
  }
  /* 블랍 배경 */
  .blob1 {
    position: absolute; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(236,72,153,0.5) 0%, rgba(236,72,153,0) 70%);
    top: -150px; left: -250px; border-radius: 50%; filter: blur(80px); z-index: 0;
  }
  .blob2 {
    position: absolute; width: 1000px; height: 1000px;
    background: radial-gradient(circle, rgba(99,102,241,0.5) 0%, rgba(99,102,241,0) 70%);
    bottom: -200px; right: -300px; border-radius: 50%; filter: blur(100px); z-index: 0;
  }
  
  .content { z-index: 1; text-align: center; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  
  /* 상단 */
  .badge {
    background: rgba(255,255,255,0.15);
    padding: 20px 50px; border-radius: 100px;
    font-size: 2.8rem; font-weight: 800; letter-spacing: 2px;
    color: #fbcfe8; border: 3px solid rgba(255,255,255,0.3);
    margin-bottom: 60px; box-shadow: 0 0 50px rgba(236,72,153,0.4);
    display: inline-block;
  }
  .title {
    font-size: 6.5rem; line-height: 1.4; font-weight: 900; margin: 0;
    text-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .highlight {
    background: linear-gradient(to right, #fb7185, #f472b6, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* 중앙 미드 */
  .mid-section {
    margin: 150px 0;
    width: 800px; height: 800px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.1);
  }
  .mid-icon { font-size: 15rem; margin-bottom: 40px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); }
  .mid-text { font-size: 4rem; font-weight: 800; color: #e2e8f0; }

  /* 하단 */
  .footer {
    background: linear-gradient(135deg, rgba(236,72,153,0.25), rgba(99,102,241,0.25));
    border: 4px solid rgba(255,255,255,0.3); border-radius: 60px;
    padding: 70px 60px; width: 100%; box-sizing: border-box;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .footer-text { font-size: 3.5rem; line-height: 1.5; font-weight: 700; color: #fff; }
  .footer-highlight { color: #fbbf24; font-size: 4rem; font-weight: 900; }
  .footer-sub { font-size: 2.2rem; color: #cbd5e1; margin-top: 25px; font-weight: 500; }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="container">
    
    <div class="content" style="margin-top: 100px;">
      <div class="badge">✨ 무료 사주 이벤트</div>
      <h1 class="title">
        폼 미친 6월<br>
        <span class="highlight">나의 운세가 무료!</span>
      </h1>
    </div>

    <div class="mid-section">
      <div class="mid-icon">🔮</div>
      <div class="mid-text">내 6월 운세는?</div>
    </div>

    <div class="content footer">
      <div class="footer-text">
        <span class="footer-highlight">DM으로 양식에 맞춰</span> 보내주시면<br>
        순서대로 꼼꼼하게 운세 배달해 드림! 🚀
      </div>
      <div class="footer-sub">
        (직접 수작업으로 보니 쪼~금 걸릴 수 있음 주의 😉)
      </div>
    </div>

  </div>

  <!-- 이미지로 자동 변환해주는 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    window.onload = function() {
      // 로딩되자마자 0.5초 뒤에 캡처 실행
      setTimeout(() => {
        html2canvas(document.body, { scale: 1 }).then(canvas => {
          let link = document.createElement('a');
          link.download = '인스타_릴스_홍보용_썸네일.png';
          link.href = canvas.toDataURL();
          link.click();
        });
      }, 500);
    };
  </script>
</body>
</html>
